<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
     <div id="container">
        <div id="screen"></div>
        <div id="buttons">
            <div id="left-buttons">
                <button class="top-row" id="backspace">
                <--
                </button>
                <button class="top-row" id="clear">
                    AC
                </button>
                <button class="top-row">
                    %
                </button>
                <button class="number-btn" id="num7">
                    7
                </button>
                <button class="number-btn" id="num8">
                    8
                </button>
                <button class="number-btn" id="num9">
                    9
                </button>
                <button class="number-btn" id="num4">
                    4
                </button>
                <button class="number-btn" id="num5">
                    5
                </button>
                <button class="number-btn" id="num6">
                    6
                </button>
                <button class="number-btn" id="num1">
                    1
                </button>
                <button class="number-btn" id="num2">
                    2
                </button>
                <button class="number-btn" id="num3">
                    3
                </button>
                <button class="number-btn">
                    +/-
                </button>
                <button class="number-btn" id="num0">
                    0
                </button>
                <button class="number-btn" id="decimal">
                    .
                </button>
            </div>
            <div id="right-buttons">
                <button class="op-button">
                    /
                </button>
                <button class="op-button">
                    X
                </button>
                <button class="op-button">
                    -
                </button>
                <button class="op-button" id="add-btn">
                    +
                </button>
                <button id="equals-btn">
                    =
                </button>
            </div>
        </div>
     </div>
</body>
</html>
